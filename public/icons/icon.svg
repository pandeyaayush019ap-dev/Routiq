<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="truck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Navigation Highway Path in background -->
  <path d="M 140 450 C 180 320, 240 220, 320 120" stroke="#60A5FA" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M 140 450 C 180 320, 240 220, 320 120" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="24 16" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Destination Pin -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="#EF4444" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
  </g>

  <!-- Heavy Truck Cab Silhouette -->
  <g transform="translate(100, 190)" filter="url(#shadow)">
    <!-- Main Trailer Body -->
    <rect x="20" y="40" width="180" height="130" rx="12" fill="url(#truck)" />
    <!-- Cab -->
    <path d="M 200 70 L 255 70 C 265 70, 275 80, 280 92 L 295 130 C 298 138, 300 145, 300 155 L 300 170 L 200 170 Z" fill="url(#truck)" />
    <!-- Cab Window -->
    <path d="M 215 85 L 255 85 C 260 85, 266 90, 269 98 L 280 125 L 215 125 Z" fill="#1E293B" />
    <!-- Chassis & Wheels -->
    <rect x="35" y="170" width="250" height="15" fill="#334155" rx="4" />
    <!-- Wheels -->
    <circle cx="65" cy="185" r="28" fill="#0F172A" />
    <circle cx="65" cy="185" r="12" fill="#94A3B8" />
    <circle cx="125" cy="185" r="28" fill="#0F172A" />
    <circle cx="125" cy="185" r="12" fill="#94A3B8" />
    <circle cx="255" cy="185" r="28" fill="#0F172A" />
    <circle cx="255" cy="185" r="12" fill="#94A3B8" />
    <!-- Headlight beam -->
    <polygon points="300,150 360,135 360,175 300,165" fill="#FEF08A" opacity="0.7" />
  </g>

  <!-- Brand Text -->
  <text x="256" y="445" font-family="Inter, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ROUTIQ</text>
</svg>
